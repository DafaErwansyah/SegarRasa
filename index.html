<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SegarRasa - Jus, Camilan & Roti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; color: #18352a; background: #fff; line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  header { position: sticky; top: 0; z-index: 10; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .nav { max-width: 1200px; margin: auto; min-height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; gap: 25px; }
  .logo { font-size: 29px; font-weight: 800; color: #e72f45; }
  .logo span { color: #19834a; }
  .tagline { font-size: 12px; color: #666; text-align: center; margin-top: -5px; }
  nav { display: flex; gap: 28px; font-weight: 700; }
  nav a:hover, nav a.active { color: #19834a; }
  .icons { display: flex; gap: 18px; font-size: 23px; }
  .hero { max-width: 1280px; margin: 0 auto; position: relative; overflow: hidden; }
  .hero img { width: 100%; height: 340px; object-fit: cover; display: block; }
  .hero-content { position: absolute; left: 5%; top: 50%; transform: translateY(-50%); max-width: 470px; }
  .hero h1 { font-size: clamp(34px, 5vw, 58px); line-height: 1; margin: 8px 0 15px; color: #16814a; }
  .hero h1 span { color: #e92f45; }
  .hero p { font-size: 18px; margin-bottom: 22px; color: #294339; }
  .btn { display: inline-block; background: #19834a; color: white; border: 0; border-radius: 28px; padding: 13px 25px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #126b3b; transform: translateY(-1px); }
  section { max-width: 1200px; margin: auto; padding: 45px 22px; }
  .section-head { display:flex; justify-content:space-between; align-items:end; gap: 15px; margin-bottom: 25px; }
  .section-head h2 { font-size: 34px; }
  .section-head p { color: #66756d; }
  .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
  .card { border: 1px solid #e6e9e7; border-radius: 16px; overflow: hidden; background: white; box-shadow: 0 5px 18px rgba(0,0,0,.07); transition: .2s; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,.11); }
  .card img { width: 100%; height: 245px; object-fit: cover; display:block; }
  .card-body { padding: 18px; }
  .card h3 { font-size: 23px; margin-bottom: 6px; }
  .desc { color: #5d6963; min-height: 70px; }
  .price { font-size: 22px; font-weight: 800; color: #176c40; margin: 8px 0; }
  .rating { color: #f3a900; margin-bottom: 12px; }
  .rating span { color:#68716d; font-size: 14px; margin-left: 5px; }
  .cart { width:100%; border:0; border-radius:10px; padding:12px; background:#249653; color:white; font-weight:700; font-size:15px; cursor:pointer; }
  .cart:hover { background:#18753f; }
  .features { background:#f3faf5; }
  .feature-grid { max-width: 1200px; margin:auto; display:grid; grid-template-columns:repeat(4,1fr); padding:28px 22px; gap:25px; text-align:center; }
  .feature { font-weight:700; }
  .feature small { display:block; color:#60806c; font-weight:400; }
  footer { background:#173d2b; color:white; text-align:center; padding:28px 20px; }
  .toast { position:fixed; right:20px; bottom:20px; background:#173d2b; color:white; padding:13px 18px; border-radius:10px; opacity:0; transform:translateY(20px); pointer-events:none; transition:.25s; }
  .toast.show { opacity:1; transform:translateY(0); }

  .checkout-overlay {
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.55); align-items:center; justify-content:center;
    padding:18px;
  }
  .checkout-overlay.show { display:flex; }
  .checkout-modal {
    position:relative; width:min(520px,100%); max-height:92vh; overflow:auto;
    background:#fff; border-radius:18px; padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .checkout-modal h2 { margin-bottom:18px; }
  .close-checkout {
    position:absolute; right:16px; top:10px; border:0; background:none;
    font-size:30px; cursor:pointer; color:#68716d;
  }
  .cart-row {
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; padding:10px 0; border-bottom:1px solid #eee;
  }
  .cart-row small { display:block; color:#68716d; }
  .qty {
    display:flex; align-items:center; gap:7px;
  }
  .qty button {
    width:28px; height:28px; border:1px solid #d8dedb; background:#f7faf8;
    border-radius:7px; cursor:pointer; font-weight:700;
  }
  .remove-item {
    border:0; background:none; color:#d33; cursor:pointer; font-size:13px;
  }
  .checkout-total {
    display:flex; justify-content:space-between; font-size:20px;
    padding:18px 0; margin-bottom:8px;
  }
  .checkout-modal label {
    display:block; margin:10px 0 5px; font-weight:700;
  }
  .checkout-modal input, .checkout-modal textarea {
    width:100%; padding:12px; border:1px solid #d9dfdc; border-radius:9px;
    font:inherit; outline:none;
  }
  .checkout-modal input:focus, .checkout-modal textarea:focus {
    border-color:#19834a;
  }
  .wa-checkout {
    width:100%; margin-top:17px; padding:13px; border:0; border-radius:10px;
    background:#20a958; color:white; font-size:16px; font-weight:800; cursor:pointer;
  }
  .wa-checkout:hover { background:#168b46; }
  .checkout-info { text-align:center; color:#718078; font-size:12px; margin-top:8px; }
  .empty-cart { padding:18px 0; color:#68716d; text-align:center; }

  @media(max-width:800px) {
    nav { display:none; }
    .products { grid-template-columns:1fr; }
    .feature-grid { grid-template-columns:repeat(2,1fr); }
    .hero img { height:420px; }
    .hero-content { left:7%; right:7%; }
  }
  @media(max-width:500px) {
    .feature-grid { grid-template-columns:1fr; }
    .logo { font-size:24px; }
    .icons { font-size:19px; }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div>
      <div class="logo"><span>🍉</span> Segar<span>Rasa</span></div>
      <div class="tagline">Jus · Camilan · Roti</div>
    </div>
    <nav>
      <a class="active" href="#beranda">Beranda</a>
      <a href="#produk">Produk</a>
      <a href="#tentang">Tentang Kami</a>
      <a href="#kontak">Kontak</a>
    </nav>
    <div class="icons"><span>⌕</span><span>🛒</span><span>♙</span></div>
  </div>
</header>
